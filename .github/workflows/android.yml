name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Stamp the build number into the app
        run: echo "window.RRD_BUILD = ${{ github.run_number }};" > www/build.js

      - name: Copy app into Android project
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        env:
          RRD_KEYSTORE_PASSWORD: ${{ secrets.RRD_KEYSTORE_PASSWORD }}
          RRD_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon || (echo 'Nouvel essai dans 60 s (serveur Maven occupé)'; sleep 60; ./gradlew assembleRelease --no-daemon)

      - name: APK, automatic-update bundle and manifest
        run: |
          N=${{ github.run_number }}
          BASE="https://github.com/${{ github.repository }}/releases/download/build-$N"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/RRD-Rapport-build-$N.apk"
          (cd www && zip -qr "../out/web-$N.zip" .)
          NATIVE_MIN=$(tr -dc '0-9' < native_min.txt)
          printf '{"web":%s,"url":"%s/web-%s.zip","native_min":%s,"apk_url":"%s/RRD-Rapport-build-%s.apk"}\n' \
            "$N" "$BASE" "$N" "$NATIVE_MIN" "$BASE" "$N" > out/web.json
          cat out/web.json

      - uses: actions/upload-artifact@v4
        with:
          name: RRD-Rapport-build-${{ github.run_number }}
          path: out/*.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RRD Rapport – build ${{ github.run_number }}
          make_latest: true
          files: |
            out/*.apk
            out/web-*.zip
            out/web.json
