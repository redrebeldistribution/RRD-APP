name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Copy app into Android project
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        env:
          RRD_KEYSTORE_PASSWORD: ${{ secrets.RRD_KEYSTORE_PASSWORD }}
          RRD_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/RRD-Rapport-build-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RRD-Rapport-build-${{ github.run_number }}
          path: out/*.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RRD Rapport – build ${{ github.run_number }}
          files: out/*.apk
