name: Essais sur émulateur Android

# À chaque changement de l'application : un téléphone Android virtuel installe une copie d'ESSAI
# (reliée à un faux bureau, jamais au vrai serveur ni aux vraies feuilles) et joue les scénarios de tests/emulateur.
# Résultat : coche verte ou croix rouge sur GitHub, captures d'écran dans « Artifacts ».
on:
  push:
    branches: [main]
    paths: ['www/**', 'android/**', 'tests/emulateur/**', 'package*.json', 'capacitor.config.json', '.github/workflows/emulateur.yml']
  pull_request:
    paths: ['www/**', 'android/**', 'tests/emulateur/**', 'package*.json', 'capacitor.config.json', '.github/workflows/emulateur.yml']
  workflow_dispatch:

concurrency:
  group: emulateur-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  essais:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Copie d'essai (faux bureau, pas de chat, pas de mise à jour)
        run: |
          echo "window.RRD_BUILD = ${{ github.run_number }};" > www/build.js
          bash tests/emulateur/preparer.sh www http://10.0.2.2:8765
          # Essai seulement : l'émulateur est un processeur x86_64 et le faux bureau est en http.
          sed -i "s/abiFilters 'arm64-v8a', 'armeabi-v7a'/abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'/" android/app/build.gradle
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          grep -q x86_64 android/app/build.gradle && grep -q usesCleartextTraffic android/app/src/main/AndroidManifest.xml

      - name: Construire l'APK d'essai
        run: |
          npx cap sync android
          cd android && chmod +x gradlew
          ./gradlew assembleDebug --no-daemon || (sleep 60; ./gradlew assembleDebug --no-daemon)

      - name: Lancer le faux bureau
        run: |
          pip install --quiet websocket-client
          nohup python3 tests/emulateur/faux_bureau.py 8765 tests/emulateur/journal-bureau.jsonl > /tmp/bureau.log 2>&1 &
          sleep 2 && curl -sf http://127.0.0.1:8765/_recu

      - name: Activer l'accélération de l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Téléphone virtuel (Android 11) et scénarios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tests/emulateur/lancer.sh $GITHUB_WORKSPACE/captures

      - name: Résumé
        if: always()
        run: |
          echo "## Essais sur émulateur — build ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          cat captures/resume.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Pas de résumé (l'émulateur n'a pas démarré ?)" >> $GITHUB_STEP_SUMMARY

      - name: Captures d'écran et journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essais-emulateur-${{ github.run_number }}
          path: |
            captures/
            tests/emulateur/journal-bureau.jsonl
          if-no-files-found: ignore
