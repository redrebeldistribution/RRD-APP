<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b91c1c">
<title>RRD</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RRD">
<style>
  :root { --bg:#ffffff; --txt:#1a1a1a; --mut:#6b7280; --acc:#b91c1c; --acc-txt:#fff; --sec:#f2f4f7; --ok:#15803d; --bad:#b91c1c; --warn:#b45309; --line:#e5e7eb; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--txt); }
  .top { background:var(--acc); color:#fff; padding:calc(10px + env(safe-area-inset-top)) 14px 10px; display:flex; align-items:center; gap:10px; }
  .top b { font-size:17px; flex:1; } .top .pill { font-size:12px; background:rgba(255,255,255,.2); padding:3px 9px; border-radius:20px; }
  .sect { display:flex; background:#991b1b; }
  .sect a { flex:1; text-align:center; padding:11px 4px; color:#fecaca; text-decoration:none; font-weight:600; font-size:15px; border-bottom:3px solid transparent; }
  .sect a.on { color:#fff; border-bottom-color:#fff; }
  .wrap { max-width:560px; margin:0 auto; padding:14px 14px 100px; }
  h1 { font-size:20px; margin:4px 0 2px; } h2 { font-size:17px; margin:18px 0 8px; }
  .sub { color:var(--mut); font-size:14px; margin-bottom:12px; }
  label { display:block; font-size:14px; color:var(--mut); margin:12px 0 4px; }
  input, select, textarea { width:100%; font-size:17px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--txt); }
  textarea { min-height:70px; }
  .unit { font-size:12px; color:var(--mut); }
  button { font-size:16px; padding:13px 14px; border:0; border-radius:10px; background:var(--acc); color:var(--acc-txt); cursor:pointer; }
  button.sec { background:var(--sec); color:var(--txt); }
  button:disabled { opacity:.5; }
  .row { display:flex; gap:8px; } .row > * { flex:1; min-width:0; } input[type=date] { min-width:0; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:var(--bg); border-top:1px solid var(--line); }
  .bar .in { max-width:560px; margin:0 auto; display:flex; gap:8px; } .bar button { flex:1; }
  .card { border:1px solid var(--line); border-radius:12px; padding:12px; margin:8px 0; }
  .big { font-size:26px; font-weight:600; letter-spacing:.5px; }
  .err { background:#fef2f2; color:var(--bad); border-radius:10px; padding:10px 12px; margin:10px 0; white-space:pre-line; }
  .okb { background:#f0fdf4; color:var(--ok); border-radius:10px; padding:10px 12px; margin:10px 0; }
  .wait { background:#fffbeb; color:var(--warn); border-radius:10px; padding:10px 12px; margin:10px 0; }
  .note { background:var(--sec); border-radius:10px; padding:10px 12px; margin:10px 0; font-size:14px; }
  table { width:100%; border-collapse:collapse; font-size:14px; } td { padding:7px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.n { text-align:right; white-space:nowrap; }
  .hidden { display:none; } .mut { color:var(--mut); font-size:13px; } .center { text-align:center; }
  .bigbtn { width:100%; padding:18px; font-size:18px; margin:8px 0; }
  img.prev, img.photo { max-width:100%; border-radius:10px; margin-top:8px; }
  th { padding:7px 4px; border-bottom:1px solid var(--line); text-align:left; } th.n { text-align:right; }
  button.danger { background:#7f1d1d; color:#fff; }
  .tabs { display:flex; gap:6px; overflow-x:auto; margin:8px 0 4px; } .tabs button { flex:none; padding:8px 12px; font-size:14px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:12px; background:var(--sec); }
  .ph3 { display:flex; gap:8px; margin:12px 0; } .ph3 button { flex:1; padding:14px 4px; font-size:15px; line-height:1.35; }
  .ph3 button.fait { background:#dcfce7; color:var(--ok); } .ph3 button.att { background:#fef3c7; color:var(--warn); }
  .phg { display:grid; grid-template-columns:repeat(10,1fr); gap:3px; margin:8px 0; } .phg div { text-align:center; font-size:11px; padding:5px 0; border-radius:6px; background:var(--sec); color:var(--mut); }
  .phg .g3 { background:#dcfce7; color:var(--ok); } .phg .g1 { background:#fef3c7; color:var(--warn); } .phg .g0 { background:#fee2e2; color:var(--bad); }
  .b-ok { background:#dcfce7; color:var(--ok); } .b-bad { background:#fee2e2; color:var(--bad); } .b-warn { background:#fef3c7; color:var(--warn); }
</style>
</head>
<body>
<div class="top"><b>RRD</b><span class="pill" id="net">…</span></div>
<div class="sect hidden" id="sect"><a class="on" href="index.html">📋 Rapports</a><a href="transfert.html">💸 Transferts</a><a href="#" id="sPhotos" class="hidden" onclick="ecranPhotos();phActualiser();return false">📷 Photos</a></div>
<input type="file" id="phInput" accept="image/*" capture="environment" class="hidden" onchange="phPrise(this)">
<div class="wrap" id="app"><p class="center mut" style="margin-top:40px">Chargement…</p></div>
<div class="bar hidden" id="bar"><div class="in" id="barIn"></div></div>

<script>/* toujours la dernière version des réglages (pas de vieux fichier en mémoire du navigateur) */
document.write('<script src="config.js?' + Date.now() + '"><\/script><script src="build.js?' + Date.now() + '"><\/script>');</script>
<script>
/* Mise à jour automatique : on confirme tout de suite que cette version démarre bien (sinon retour automatique à la précédente). */
try { window.Capacitor && Capacitor.Plugins.CapacitorUpdater && Capacitor.Plugins.CapacitorUpdater.notifyAppReady(); } catch (e) { }
</script>
<script>
/* ======================= Outils ======================= */
var VERSION_APP = '1.11.0';
var TZ = 'America/Port-au-Prince', CUTOFF_HOUR = 4;
var DEV = 'dollars haïtiens';
var CHAMPS_DEFAUT = [
  { k: 'opening_meter', label: 'Compteur ouverture', req: true },
  { k: 'closing_meter', label: 'Compteur fermeture', req: true },
  { k: 'starting_cash', label: 'Solde initial', req: true, money: true },
  { k: 'counted_cash', label: 'Caisse comptée à la fermeture', req: true, money: true },
  { k: 'bank_deposit', label: 'Dépôt en banque', money: true },
  { k: 'other_cash_in', label: 'Autres entrées d\'argent', money: true },
  { k: 'generator_fuel', label: 'Carburant génératrice', money: true },
  { k: 'withdrawals', label: 'Prélèvements', money: true },
  { k: 'other_expenses', label: 'Autres dépenses', money: true },
  { k: 'gas_received', label: 'Gaz reçu aujourd\'hui (gal)' }
];
var fmt = function (n) { if (n === null || n === undefined || n === '' || isNaN(n)) return '—'; return Number(n).toLocaleString('fr-FR', { maximumFractionDigits: 2 }); };
var esc = function (s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var $ = function (id) { return document.getElementById(id); };
var dfr = function (d) { return d ? String(d).split('-').reverse().join('/') : ''; };
function libPer(p) { return { '': 'Toute la journée', AM: 'Équipe du matin', PM: 'Équipe du soir' }[p || ''] || p; }
/* Nombre strict : « 1 788 » ou « 1,788 » = mille sept cent quatre-vingt-huit ; « 1788 2862 » est refusé (deux montants collés) ;
   plusieurs montants s'additionnent avec + (ex. 1788+2862). */
function nb(s) {
  s = String(s === undefined || s === null ? '' : s).replace(/[$]|HTG|gdes?/gi, '').trim(); if (!s) return null;
  var tot = 0, parts = s.split('+');
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i].trim();
    if (!/^(\d{1,3}([ \u00a0\u202f,]\d{3})+|\d+)(\.\d+)?$/.test(p)) return null;
    tot += Number(p.replace(/[ \u00a0\u202f,]/g, ''));
  }
  return Math.round(tot * 100) / 100;
}

/* Heure d'Haïti, même règle que le serveur : avant 4 h, c'est encore la veille. */
function partiesHaiti(t) {
  var f = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  var o = {}; f.formatToParts(t).forEach(function (p) { o[p.type] = p.value; });
  if (o.hour === '24') o.hour = '00';
  return o;
}
function dateRapport() {
  var now = new Date(), p = partiesHaiti(now);
  var d = Number(p.hour) < CUTOFF_HOUR ? new Date(now.getTime() - 24 * 3600 * 1000) : now;
  var q = partiesHaiti(d);
  return q.year + '-' + q.month + '-' + q.day;
}
function maintenant() { var p = partiesHaiti(new Date()); return p.year + '-' + p.month + '-' + p.day + ' ' + p.hour + ':' + p.minute + ':' + p.second; }
function refAleatoire(code, date) {
  var L = 'ABCDEFGHJKLMNPQRSTUVWXYZ', s = '', a = new Uint32Array(4);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach(function (_, i) { a[i] = Math.floor(Math.random() * 1e9); });
  for (var i = 0; i < 4; i++) s += L.charAt(a[i] % L.length);
  return code + '-' + date.replace(/-/g, '') + '-' + s;
}

/* ======================= Stockage ======================= */
var CFG = {
  get: function (k, d) { try { var v = localStorage.getItem('rrd.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem('rrd.' + k, JSON.stringify(v)); } catch (e) { } if (CLES_SURES.indexOf(k) >= 0) copieNative(); },
  del: function (k) { try { localStorage.removeItem('rrd.' + k); } catch (e) { } if (CLES_SURES.indexOf(k) >= 0) copieNative(); }
};
/* Copie de sécurité dans le stockage natif du téléphone : la mise à jour de l'APK peut vider le stockage web. */
var NAT = (window.Capacitor && Capacitor.Plugins) || {};
/* Version web (iPhone, ordinateur) : seulement pour la direction et la comptabilité, qui sont toujours en ligne. */
var WEB = !(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
var CLES_SURES = ['jeton', 'role', 'nom', 'station', 'api', 'appareil', 'init', 'init_le', 'champs', 'noms'];
function copieNative() {
  if (!NAT.Preferences) return;
  var o = {}; CLES_SURES.forEach(function (k) { var v = localStorage.getItem('rrd.' + k); if (v !== null) o[k] = v; });
  NAT.Preferences.set({ key: 'rrd.sauvegarde', value: JSON.stringify(o) }).catch(function () { });
}
var FS_DOSSIER = 'rapports';
function copieRapport(r) {
  if (!NAT.Filesystem) return Promise.resolve();
  return NAT.Filesystem.writeFile({ path: FS_DOSSIER + '/' + r.ref + '.json', directory: 'DATA', data: JSON.stringify(r), encoding: 'utf8', recursive: true }).catch(function () { });
}
/* Au démarrage : identité fixe du téléphone + restauration de ce que le stockage web aurait perdu. */
function restaurer() {
  var etapes = [];
  if (NAT.Preferences) etapes.push(NAT.Preferences.get({ key: 'rrd.sauvegarde' }).then(function (x) {
    if (!x || !x.value) return copieNative();
    var o = JSON.parse(x.value);
    Object.keys(o).forEach(function (k) { if (localStorage.getItem('rrd.' + k) === null) localStorage.setItem('rrd.' + k, o[k]); });
  }).catch(function () { }));
  if (NAT.Device) etapes.push(NAT.Device.getId().then(function (x) { if (x && x.identifier) S.idFixe = 'D' + x.identifier; }).catch(function () { }));
  if (NAT.Filesystem) etapes.push(NAT.Filesystem.readdir({ path: FS_DOSSIER, directory: 'DATA' }).then(function (d) {
    return tous().then(function (liste) {
      var connus = {}; liste.forEach(function (r) { connus[r.ref] = r; });
      return Promise.all((d.files || []).map(function (f) {
        var nom = typeof f === 'string' ? f : f.name; if (!/\.json$/.test(nom)) return;
        var ref = nom.replace(/\.json$/, ''); if (connus[ref]) return;
        return NAT.Filesystem.readFile({ path: FS_DOSSIER + '/' + nom, directory: 'DATA', encoding: 'utf8' })
          .then(function (c) { return tx('readwrite', function (s) { s.put(JSON.parse(c.data)); }); }).catch(function () { });
      }));
    });
  }).catch(function () { }));
  return Promise.all(etapes);
}
/* File d'attente dans IndexedDB (les photos sont trop lourdes pour localStorage). */
var DB = null;
function db() {
  if (DB) return Promise.resolve(DB);
  return new Promise(function (res, rej) {
    var r = indexedDB.open('rrd-rapports', 1);
    r.onupgradeneeded = function () { r.result.createObjectStore('rapports', { keyPath: 'ref' }); };
    r.onsuccess = function () { DB = r.result; res(DB); };
    r.onerror = function () { rej(r.error); };
  });
}
function tx(mode, fn) {
  return db().then(function (d) {
    return new Promise(function (res, rej) {
      var t = d.transaction('rapports', mode), s = t.objectStore('rapports'), out;
      out = fn(s); t.oncomplete = function () { res(out && out.result !== undefined ? out.result : out); }; t.onerror = function () { rej(t.error); };
    });
  });
}
function tous() { return tx('readonly', function (s) { return s.getAll(); }); }
function sauver(r) { return tx('readwrite', function (s) { s.put(r); }).then(function () { return copieRapport(r); }); }

/* ======================= Serveur ======================= */
function api(action, extra) {
  var url = CFG.get('api', window.RRD_CONFIG && RRD_CONFIG.API_URL || '');
  if (!url) return Promise.reject({ erreur: 'Adresse du serveur manquante.', code: 'CONFIG', reseau: false });
  var body = Object.assign({ action: action, jeton: CFG.get('jeton', '') }, extra || {});
  var ctl = new AbortController(), t = setTimeout(function () { ctl.abort(); }, 60000);
  return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow', signal: ctl.signal })
    .then(function (r) { clearTimeout(t); return r.text(); })
    .then(function (txt) {
      var j; try { j = JSON.parse(txt); } catch (e) { throw { erreur: 'Réponse illisible du serveur.', reseau: true }; }
      if (!j.ok) throw { erreur: j.erreur, code: j.code || '', reseau: j.code === 'SERVEUR', controles: j.controles || null };
      return j.data;
    }, function () { clearTimeout(t); throw { erreur: 'Pas de connexion.', reseau: true }; });
}

/* ======================= État ======================= */
var S = { init: null, en_ligne: false, sync: false };
function majNet(t) { var n = $('net'); if (n) n.textContent = t; }
function stationCode() { return (CFG.get('station', {}) || {}).code; }

function view(html, barHtml, ecran) {
  S.ecran = ecran || '';
  $('app').innerHTML = html;
  $('sect').classList.toggle('hidden', !CFG.get('jeton', ''));
  var sp = $('sPhotos'), surPhotos = S.ecran.indexOf('photo') === 0;   // onglet Photos : seulement pour le téléphone d'une station
  sp.classList.toggle('hidden', !CFG.get('jeton', '') || !!CFG.get('role', '')); sp.classList.toggle('on', surPhotos); $('sect').firstChild.classList.toggle('on', !surPhotos);
  bandeauMaj();
  if (barHtml) { $('barIn').innerHTML = barHtml; $('bar').classList.remove('hidden'); } else $('bar').classList.add('hidden');
  window.scrollTo(0, 0);
}

/* ======================= Enregistrement du téléphone ======================= */
function ecranEnregistrer(msg) {
  var h = (WEB ? '<h1>Tableau de bord RRD</h1><div class="sub">Version web, pour la direction et la comptabilité. Entrez votre code (DIR-… ou CPT-…). Les stations utilisent l\'application Android.</div>'
    : '<h1>Enregistrer ce téléphone</h1><div class="sub">À faire une seule fois. La direction vous donne le code de la station.</div>') +
    (msg ? '<div class="err">' + esc(msg) + '</div>' : '') +
    '<label for="code">Code d\'activation</label><input id="code" autocapitalize="characters" autocomplete="off" placeholder="ex. ESA-4821">' +
    '<details style="margin-top:18px"><summary class="mut">Paramètres avancés</summary><label for="url">Adresse du serveur</label>' +
    '<input id="url" autocomplete="off" value="' + esc(CFG.get('api', window.RRD_CONFIG && RRD_CONFIG.API_URL || '')) + '"></details>' +
    '<p class="mut">Il faut internet pour cette étape seulement. Ensuite, les rapports peuvent se faire sans connexion.</p>';
  view(h, '<button id="bEnr" onclick="enregistrer()">Enregistrer</button>');
}
function enregistrer() {
  var code = $('code').value.trim(), url = $('url').value.trim();
  if (!code) return ecranEnregistrer('Entrez le code d\'activation.');
  if (url) CFG.set('api', url);
  var b = $('bEnr'); b.disabled = true; b.textContent = 'Enregistrement…';
  var id = CFG.get('appareil', '') || ('A' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8)); CFG.set('appareil', id);
  var ids = [id]; if (S.idFixe && S.idFixe !== id) ids.push(S.idFixe);
  api('enregistrer', { web: WEB, code: code, appareil_id: ids.join('|'), modele: navigator.userAgent.slice(0, 80) }).then(function (d) {
    CFG.set('jeton', d.jeton);
    if (d.role) { CFG.set('role', d.role); CFG.set('nom', d.nom); if (d.role === 'transferts') return location.replace('transfert.html'); return demarrerDirection(); }
    CFG.set('role', ''); CFG.set('station', d.station);
    accueil();
    synchroniser();
  }).catch(function (e) { ecranEnregistrer(e.reseau ? 'Pas de connexion internet. Réessayez quand le téléphone a du signal.' : e.erreur); });
}

/* ======================= Accueil ======================= */
function infoServeur(date) {
  /* Ce que le serveur a dit (dernière connexion) pour ce jour-là, ou null si on ne sait pas. */
  var c = S.init || CFG.get('init', null); if (!c) return null;
  if (c.date === date) return { envoyes: c.envoyes || [], prerempli: c.prerempli || null };
  var j = (c.jours || []).filter(function (x) { return x.date === date; })[0];
  return j ? { envoyes: j.envoyes || [], prerempli: j.prerempli || null } : null;
}
function infosDuJour(liste, date) {
  /* Ce qu'on sait pour un jour : rapports confirmés par le serveur + ceux en attente sur le téléphone. */
  date = date || dateRapport(); var st = stationCode();
  var cache = infoServeur(date);
  var envoyes = cache ? cache.envoyes.slice() : [];
  var locaux = liste.filter(function (r) { return r.date === date && r.station === st && r.statut !== 'rejete' && r.statut !== 'annule'; });
  locaux.forEach(function (r) { if (!envoyes.some(function (x) { return x.ref === r.ref; })) envoyes.push({ ref: r.ref, periode: r.periode, local: r }); });
  var pers = envoyes.map(function (r) { return String(r.periode || ''); });
  var periodes;
  if (pers.indexOf('') >= 0) periodes = [];
  else if (pers.indexOf('AM') >= 0 && pers.indexOf('PM') >= 0) periodes = [];
  else if (pers.indexOf('AM') >= 0) periodes = ['PM'];
  else if (pers.indexOf('PM') >= 0) periodes = ['AM'];
  else periodes = ['', 'AM'];
  return { date: date, envoyes: envoyes, periodes: periodes, connu: !!cache, prerempli: cache ? cache.prerempli : null };
}
function accueil() {
  tous().then(function (liste) {
    var st = CFG.get('station', {}), j = infosDuJour(liste);
    var attente = liste.filter(function (r) { return r.statut === 'attente'; });
    var rejetes = liste.filter(function (r) { return r.statut === 'rejete' && !r.vu; });
    var annules = liste.filter(function (r) { return r.statut === 'annule' && !r.vu; });
    var h = '<h1>' + esc(st.nom || '') + '</h1><div class="sub">Journée du ' + dfr(j.date) + '</div>';
    if (attente.length) h += '<div class="wait">⏳ ' + attente.length + ' rapport(s) en attente d\'envoi. Ils partiront tout seuls dès qu\'il y aura du signal.</div>';
    liste.filter(function (r) { return r.statut === 'verif'; }).forEach(function (r) {
      h += '<div class="err">⚠️ Rapport du ' + dfr(r.date) + ' (' + esc(libPer(r.periode)) + ') pas encore accepté : le bureau demande de revérifier des chiffres.\n<button style="margin-top:8px" onclick="revoir(\'' + esc(r.ref) + '\')">Revoir le rapport</button></div>';
    });
    annules.forEach(function (r) {
      h += '<div class="wait">↩️ Le rapport du ' + dfr(r.date) + ' (' + esc(libPer(r.periode)) + ') a été annulé par le bureau.' + (r.erreur ? '\nMotif : ' + esc(r.erreur) : '') + '\nIl faut le refaire.<br>' +
        '<button style="margin-top:8px" onclick="refaire(\'' + esc(r.ref) + '\')">Refaire ce rapport</button> <button class="sec" style="margin-top:8px" onclick="vuRejet(\'' + esc(r.ref) + '\')">J\'ai compris</button></div>';
    });
    rejetes.forEach(function (r) { h += '<div class="err">❌ Rapport ' + esc(r.ref) + ' (' + dfr(r.date) + ') refusé par le serveur :\n' + esc(r.erreur || '') + '\n<button class="sec" style="margin-top:8px" onclick="vuRejet(\'' + esc(r.ref) + '\')">J\'ai compris</button></div>'; });
    if (j.periodes.length) {
      h += '<button class="bigbtn" onclick="nouveau()">📋 Faire le rapport de fermeture</button>';
      if (j.envoyes.length) h += '<p class="mut center">Le rapport de l\'équipe du matin est déjà fait. Ce rapport sera celui de l\'équipe du soir.</p>';
    } else h += '<div class="okb">✅ Les rapports d\'aujourd\'hui sont faits.</div>';
    h += '<button class="sec" style="width:100%;margin-top:10px" onclick="ecranPhotos();phActualiser()">📷 Photos de l\'heure</button>';
    h += '<button class="sec" style="width:100%;margin-top:10px" onclick="ecranManquants()">📅 Rapport manquant (jours passés)</button>';
    var recents = liste.slice().sort(function (a, b) { return a.cree_le < b.cree_le ? 1 : -1; }).slice(0, 10);

    h += '<h2>Annuler ce rapport</h2><div class="card"><b>' + esc(annul.station) + '</b> · ' + dfr(annul.date) + (annul.periode_libelle && annul.periode_libelle !== 'Journée' ? ' · ' + esc(annul.periode_libelle) : '') + '<div class="mut">Envoyé par ' + esc(annul.employe) + ' · réf. ' + esc(annul.ref) + '</div><div class="mut">Motif : ' + esc(annul.motif) + '</div></div>' +
      '<div class="note">Le rapport ne sera pas effacé : il restera dans l\'historique, marqué « annulé », et ne comptera plus. La station pourra renvoyer son rapport.</div>' +
      '<div class="row"><button class="sec" onclick="ecranDetail()">Retour</button><button class="danger" id="bAnn" onclick="annuler(true)">Confirmer l\'annulation</button></div>';
  } else {
    h += '<h2>Corriger</h2>';
    if (apercu) {
      var lab = (D.champs.filter(function (f) { return f.k === apercu.champ; })[0] || {}).label || apercu.champ;
      h += '<div class="card"><b>' + esc(lab) + '</b> : ' + esc(apercu.ancienne === '' ? '(vide)' : apercu.ancienne) + ' → <b>' + esc(apercu.nouvelle) + '</b><div class="mut">Motif : ' + esc(apercu.motif) + '</div>' +
        '<div class="mut">Écart : ' + fmt(apercu.ecart_avant) + ' → ' + fmt(apercu.ecart_apres) + '</div></div>' +
        '<div class="row"><button class="sec" onclick="ecranDetail()">Annuler</button><button id="bConf" onclick="corriger(true)">Confirmer la correction</button></div>';
    } else {
      h += '<label>Champ</label><select id="cChamp">' + D.champs.map(function (f) { return '<option value="' + f.k + '">' + esc(f.label) + '</option>'; }).join('') + '</select>' +
        '<label>Nouvelle valeur</label><input id="cVal" autocomplete="off"><label>Motif (obligatoire)</label><input id="cMotif" autocomplete="off">' +
        '<div style="margin-top:10px"><button onclick="corriger(false)">Voir l\'aperçu</button></div>' +
        '<h2>Rapport envoyé par erreur ?</h2><div class="mut">L\'annulation permet à la station de renvoyer son rapport. Le rapport reste dans l\'historique.</div>' +
        '<label>Motif de l\'annulation (obligatoire)</label><input id="aMotif" autocomplete="off">' +
        '<div style="margin-top:10px"><button class="danger" onclick="annuler(false)">Annuler ce rapport…</button></div>';
    }
  }
  if (r.historique && r.historique.length) {
    h += '<h2>Historique des corrections</h2>';
    r.historique.forEach(function (c) { h += '<div class="card"><b>' + esc(c.champ) + '</b> : ' + esc(c.ancienne) + ' → ' + esc(c.nouvelle) + '<div class="mut">' + esc(c.horodatage) + ' · ' + esc(c.editeur) + ' (' + esc(c.role) + ') · ' + esc(c.motif) + '</div></div>'; });
  }
  view(h);
}
function corriger(confirmer) {
  if (!confirmer) CORR = { ref: R.ref, champ: $('cChamp').value, nouvelle_valeur: $('cVal').value, motif: $('cMotif').value };
  else $('bConf').disabled = true;
  var p = {}; Object.keys(CORR).forEach(function (k) { p[k] = CORR[k]; }); p.confirmer = !!confirmer;
  call('corriger', p).then(function (r) {
    if (!confirmer) return ecranDetail(r.apercu);
    R = r.rapport; CORR = null; ecranDetail(null, 'Correction enregistrée. Le rapport d\'origine reste inchangé ; la correction est dans l\'historique.');
  }).catch(function (e) { ecranDetail(); alerte(e.erreur || 'Pas de connexion.'); });
}
function annuler(confirmer) {
  if (!confirmer) ANNUL = { ref: R.ref, motif: $('aMotif').value };
  else $('bAnn').disabled = true;
  call('annuler', { ref: ANNUL.ref, motif: ANNUL.motif, confirmer: !!confirmer }).then(function (r) {
    if (!confirmer) return ecranDetail(null, null, r.apercu);
    R = r.rapport; ANNUL = null; ecranDetail(null, 'Rapport annulé. La station peut maintenant envoyer un nouveau rapport.');
  }).catch(function (e) { ecranDetail(); alerte(e.erreur || 'Pas de connexion.'); });
}

/* ----- Direction : suivi des photos horaires ----- */
var PHD = null, PH_L = { C: 'compteur', S: 'station', T: 'citerne' };
function ongletPhotos() {
  call('photosSuivi', { date: T.pdate || '' }).then(function (d) {
    PHD = d; T.pdate = d.date;
    var h = entete() + '<div class="row"><input type="date" value="' + d.date + '" max="' + d.aujourdhui + '" onchange="T.pdate=this.value;tableau(\'photos\')">' +
      '<button class="sec" onclick="T.pdate=jourPlus(\'' + d.date + '\',-1);tableau(\'photos\')">◀ Veille</button><button class="sec" onclick="T.pdate=\'\';tableau(\'photos\')">Aujourd\'hui</button></div>' +
      '<p class="mut">3 photos par heure (compteur, station, citerne), de 7 h à 17 h. Vert : tout y est · jaune : il manque une photo · rouge : aucune photo · gris : heure pas encore passée. Touchez une station pour voir ses photos.</p>';
    d.stations.forEach(function (s) {
      var commence = s.debut && d.date >= s.debut, req = s.types.map(function (t) { return t === 'CITERNE' ? 'T' : t.charAt(0); });
      h += '<div class="card" onclick="phOuvrir(\'' + esc(s.code) + '\')"><div class="row"><div><b>' + esc(s.nom) + '</b>' + (s.suivie ? '' : ' <span class="badge">non suivie</span>') + '</div><div style="text-align:right" class="mut">' + s.nbPhotos + ' photo(s)</div></div>';
      h += '<div class="phg">' + d.heures.map(function (hh) {
        var g = s.grille[hh] || '', complet = g && req.every(function (x) { return g.indexOf(x) >= 0; });
        return '<div class="' + (!commence ? '' : complet ? 'g3' : g ? 'g1' : s.manquantes.indexOf(hh) >= 0 ? 'g0' : '') + '">' + hh + ' h</div>';
      }).join('') + '</div>';
      if (!commence) h += '<div class="mut">Pas de photos envoyées par l\'application' + (s.debut ? ' avant le ' + dfr(s.debut) : ' pour l\'instant') + '.</div>';
      else {
        h += '<div class="mut">Heures sans photo : ' + (s.manquantes.length ? '<b style="color:var(--bad)">' + s.manquantes.map(function (x) { return x + ' h'; }).join(', ') + '</b>' : 'aucune') + '</div>';
        if (s.typesManquants.length) h += '<div class="mut">Photos manquantes : ' + s.typesManquants.map(function (x) { return x.h + ' h ' + x.type.toLowerCase(); }).join(' · ') + '</div>';
        if (s.mois.depuis) h += '<div class="mut">Mois (depuis le ' + dfr(s.mois.depuis) + ', ' + s.mois.jours + ' j) : <b>' + s.mois.heuresManquantes + '</b> heure(s) sans photo, <b>' + s.mois.typesManquants + '</b> photo(s) manquante(s) dans les heures couvertes</div>';
      }
      h += '</div>';
    });
    view(h);
  }).catch(errTab);
}
function phOuvrir(code) {
  charge();
  call('photosListe', { date: PHD.date, station: code }).then(function (d) {
    var s = PHD.stations.filter(function (x) { return x.code === code; })[0] || { nom: code };
    var h = entete() + '<h2>' + esc(s.nom) + ' — ' + dfr(d.date) + '</h2>';
    if (!d.photos.length) h += '<p class="mut">Aucune photo ce jour-là.</p>';
    else h += '<table><tr><th>Heure</th><th>Photo</th><th>Index compteur</th><th></th></tr>' + d.photos.map(function (p, i) {
      return '<tr><td>' + esc(String(p.pris_le).slice(11, 16)) + '</td><td>' + esc(p.type.toLowerCase()) + (p.note ? '<div class="mut">' + esc(p.note) + '</div>' : '') + '</td><td>' + esc(p.compteur || '') + '</td>' +
        '<td class="n"><button class="sec" style="padding:6px 10px" onclick="phVoir(\'' + esc(p.id) + '\',' + i + ')">Voir</button></td></tr><tr><td colspan="4" id="phv' + i + '" style="border:0;padding:0"></td></tr>';
    }).join('') + '</table>';
    view(h, '<button class="sec" onclick="tableau(\'photos\')">← Retour</button>');
  }).catch(errTab);
}
function phVoir(id, i) {
  var c = $('phv' + i); if (!c) return;
  if (c.innerHTML) { c.innerHTML = ''; return; }
  c.innerHTML = '<p class="mut">Chargement de la photo…</p>';
  call('photoVoir', { id: id }).then(function (d) { c.innerHTML = '<img class="photo" src="' + d.photo + '" alt="">'; }, function (e) { c.innerHTML = '<div class="err">' + esc(e.reseau ? 'Pas de connexion.' : e.erreur) + '</div>'; });
}

function ongletResume() {
  T.date = T.date || D.aujourdhui;
  call('resume', { date: T.date }).then(function (r) {
    var h = entete() + '<label>Date</label><div class="row"><input type="date" id="dR" value="' + T.date + '"><button class="sec" style="flex:none" onclick="T.date=$(\'dR\').value;tableau(\'resume\')">Afficher</button></div>' +
      '<div class="card"><table><tr><th>Station</th><th class="n">Gal</th><th class="n">Ventes</th><th class="n">Écart</th></tr>';
    r.lignes.forEach(function (l) {
      h += l.manquant ? '<tr><td>' + esc(l.nom) + '</td><td colspan="3" class="n"><span class="badge b-bad">manquant</span></td></tr>'
        : '<tr><td>' + esc(l.nom) + (l.partiel ? '<div><span class="badge b-warn">' + esc(l.partiel) + '</span></div>' : '') + '</td><td class="n">' + fmt(l.gallons) + '</td><td class="n">' + fmt(l.ventes_attendues) + '</td><td class="n">' + badgeEcart(l.ecart) + '</td></tr>';
    });
    h += '<tr><th>Total</th><th class="n">' + fmt(r.totaux.gallons) + '</th><th class="n">' + fmt(r.totaux.ventes) + '</th><th class="n">' + fmt(r.totaux.ecart) + '</th></tr></table>' +
      '<div class="mut">Rapports manquants : ' + r.totaux.manquants + (r.totaux.partiels ? ' · incomplets (une seule équipe) : ' + r.totaux.partiels : '') + '</div></div>';
    view(h);
  }).catch(errTab);
}
function ongletPrix(data) {
  var rendre = function (p) {
    var h = entete() + '<h2>Prix en vigueur</h2><div class="card"><table>';
    p.actuels.forEach(function (a) { h += '<tr><td>' + esc(a.nom) + '</td><td class="n">' + (a.prix === null ? '<span class="badge b-warn">aucun</span>' : '<b>' + fmt(a.prix) + '</b> /gal<div class="mut">depuis ' + dfr(a.depuis) + '</div>') + '</td></tr>'; });
    h += '</table></div>';
    if (p.peutModifier) {
      h += '<h2>Nouveau prix</h2><label>Station</label><select id="pSt">' + optStations('', false) + '</select>' +
        '<div class="row"><div><label>Prix par gallon <span class="unit">(' + DEV + ')</span></label><input id="pPrix" inputmode="decimal"></div>' +
        '<div><label>Date d\'effet</label><input type="date" id="pDate" value="' + D.aujourdhui + '"></div></div>' +
        '<label>Note (facultatif)</label><input id="pNote"><div style="margin-top:10px"><button id="bPrix" onclick="ajouterPrix()">Enregistrer le prix</button></div>';
    }
    h += '<h2>Historique</h2><div class="card"><table><tr><th>Station</th><th class="n">Prix</th><th class="n">Effet</th></tr>';
    p.historique.forEach(function (x) { h += '<tr><td>' + esc(x.station) + '<div class="mut">' + esc(x.saisi_par) + ' · ' + esc(x.saisi_le) + (x.note ? ' · ' + esc(x.note) : '') + '</div></td><td class="n">' + fmt(x.prix) + '</td><td class="n">' + dfr(x.date_effet) + '</td></tr>'; });
    view(h + '</table></div>');
  };
  if (data) return rendre(data);
  call('prix').then(rendre).catch(errTab);
}
function ajouterPrix() {
  var p = { station: $('pSt').value, prix: $('pPrix').value, date_effet: $('pDate').value, note: $('pNote').value };
  var nom = $('pSt').options[$('pSt').selectedIndex].text;
  if (!confirm('Prix de ' + nom + ' : ' + p.prix + ' ' + DEV + ' par gallon, à partir du ' + dfr(p.date_effet) + ' ?')) return;
  $('bPrix').disabled = true;
  call('ajouterPrix', p).then(ongletPrix).catch(function (e) { $('bPrix').disabled = false; alerte(e.erreur || 'Pas de connexion.'); });
}
function ongletAppareils(data) {
  var rendre = function (a) {
    var h = entete();
    if (a.nouveau) h += '<div class="okb">Nouveau code : <b style="font-size:20px">' + esc(a.nouveau) + '</b><br>Donnez-le à la personne qui enregistre le téléphone. Il ne marche qu\'une fois.</div>';
    h += '<h2>Nouveau code de téléphone</h2><label>Pour</label><select id="apSt">' + optStations('', false, '<option value="DIRECTION">Direction (tableau de bord)</option><option value="COMPTA">Comptabilité (tableau de bord)</option>' + (a.transferts || []).map(function (t) { return '<option value="' + esc(t.code) + '">' + esc(t.nom) + '</option>'; }).join('')) + '</select>' +
      '<label>Nom (facultatif, ex. « Téléphone Esansyel » ou « Elisana »)</label><input id="apNom" autocomplete="off">' +
      '<div style="margin-top:10px"><button id="bAp" onclick="nouveauCode()">Créer un code</button></div><h2>Téléphones</h2>';
    if (!a.appareils.length) h += '<div class="note">Aucun téléphone.</div>';
    a.appareils.slice().reverse().forEach(function (x) {
      h += '<div class="card" style="' + (x.actif ? '' : 'opacity:.55') + '"><div class="row"><div><b>' + esc(x.station_nom) + '</b>' + (x.nom ? ' · ' + esc(x.nom) : '') +
        '<div class="mut">Code ' + esc(x.code) + ' · ' + (x.utilise ? 'enregistré le ' + esc(x.enregistre_le) : 'pas encore utilisé') + (x.dernier_contact ? ' · vu le ' + esc(x.dernier_contact) : '') + '</div>' +
        '<div>' + (x.actif ? '<span class="badge b-ok">actif</span>' : '<span class="badge b-bad">désactivé</span>') + '</div></div>' +
        '<div style="display:flex;flex-direction:column;gap:6px;flex:none">' +
        '<button class="' + (x.actif ? 'danger' : 'sec') + '" onclick="basculer(\'' + esc(x.code) + '\',' + (!x.actif) + ')">' + (x.actif ? 'Désactiver' : 'Réactiver') + '</button>' +
        (x.utilise ? '<button class="sec" onclick="liberer(\'' + esc(x.code) + '\')">Libérer le code</button>' : '') + '</div></div></div>';
    });
    view(h);
  };
  if (data) return rendre(data);
  call('appareils').then(rendre).catch(errTab);
}
function nouveauCode() {
  $('bAp').disabled = true;
  call('ajouterAppareil', { station: $('apSt').value, nom: $('apNom').value }).then(ongletAppareils).catch(function (e) { $('bAp').disabled = false; alerte(e.erreur || 'Pas de connexion.'); });
}
function liberer(code) {
  if (!confirm('Libérer le code ' + code + ' ?\n\nLe téléphone qui l\'utilise sera déconnecté (ses rapports pas encore envoyés resteront bloqués dessus). Le code pourra ensuite être entré une fois sur n\'importe quel téléphone.')) return;
  call('libererAppareil', { code: code }).then(function (d) { ongletAppareils(d); alerte('Code ' + code + ' libéré : il peut être entré sur un téléphone.'); }).catch(function (e) { alerte(e.erreur || 'Pas de connexion.'); });
}
function basculer(code, actif) {
  if (!actif && !confirm('Désactiver le téléphone ' + code + ' ? Il ne pourra plus envoyer de rapports.')) return;
  call('activerAppareil', { code: code, actif: actif }).then(ongletAppareils).catch(function (e) { alerte(e.erreur || 'Pas de connexion.'); });
}

/* ======================= Démarrage ======================= */
window.addEventListener('online', function () { synchroniser(); phEnvoyer(); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) synchroniser(); });
setInterval(function () { synchroniser(); }, 2 * 60 * 1000);
S.init = CFG.get('init', null);
majNet('○ hors ligne');
/* ======================= Mises à jour automatiques ======================= */
var MAJ_URL = 'https://github.com/redrebeldistribution/RRD-APP/releases/latest/download/web.json';
function bandeauMaj() {
  if (!S.majApk || !$('app') || $('majApk')) return;
  var d = document.createElement('div'); d.id = 'majApk'; d.className = 'wait';
  d.innerHTML = '⬆️ Nouvelle version de l\'application disponible.<br><button style="margin-top:8px" onclick="installerApk()">Installer</button>';
  $('app').insertBefore(d, $('app').firstChild);
}
function installerApk() { if (confirm('Le téléchargement va s\'ouvrir. Ensuite, touchez le fichier puis « Installer ». Vos rapports restent sur le téléphone.')) location.href = S.majApk; }
function verifierMaj() {
  var P = window.Capacitor && Capacitor.Plugins, CU = P && P.CapacitorUpdater, AP = P && P.App;
  if (!CU || !AP || S.majEnCours || navigator.onLine === false) return;
  S.majEnCours = true;
  var m;
  fetch(MAJ_URL + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (x) {
    m = x; return AP.getInfo();
  }).then(function (info) {
    var natif = Number(info.build) || 0;
    if (Number(m.native_min) > natif) { S.majApk = m.apk_url; bandeauMaj(); return; }      // il faut une nouvelle APK
    if (!(Number(m.web) > Number(window.RRD_BUILD || 0))) return;                          // déjà à jour
    var ver = String(m.web);
    return CU.list().then(function (l) {
      var deja = ((l && l.bundles) || []).filter(function (b) { return b.version === ver && b.status === 'success'; })[0];
      return deja || CU.download({ url: m.url, version: ver });
    }).then(function (b) { return CU.next({ id: b.id }); }).then(function () { S.majPrete = ver; });
  }).catch(function () { }).then(function () { S.majEnCours = false; });
}
document.addEventListener('resume', function () { verifierMaj(); bandeauMaj(); phEnvoyer(); });
setInterval(function () { phEnvoyer(); if (S.ecran === 'photos') ecranPhotos(); }, 60000);   // file des photos + heure en cours à jour
setTimeout(verifierMaj, 4000); setInterval(verifierMaj, 3 * 3600 * 1000);

restaurer().then(function () {
  if (!CFG.get('jeton', '')) ecranEnregistrer();
  else if (CFG.get('role', '') === 'transferts') {   // agent de transfert sans station : pas de rapports, seulement les transferts
    if (/[?&]code=1/.test(location.search)) { view('<p class="center mut" style="margin-top:40px">…</p>'); changerCode(function () { location.replace('transfert.html'); }); }
    else location.replace('transfert.html');
  }
  else if (CFG.get('role', '')) demarrerDirection();
  else { if (/[?&]photos=1/.test(location.search)) { ecranPhotos(); phActualiser(); } else { accueil(); phEnvoyer(); } synchroniser(); }
});
</script>
