<style>
  :root { --bg:#ffffff; --txt:#1a1a1a; --mut:#6b7280; --acc:#b91c1c; --acc-txt:#fff; --sec:#f2f4f7; --ok:#15803d; --bad:#b91c1c; --warn:#b45309; --line:#e5e7eb; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--txt); }
  .top { background:var(--acc); color:#fff; padding:calc(10px + env(safe-area-inset-top)) 14px 10px; display:flex; align-items:center; gap:10px; }
  .top b { font-size:17px; flex:1; } .top .pill { font-size:12px; background:rgba(255,255,255,.2); padding:3px 9px; border-radius:20px; }
  .sect { display:flex; background:#991b1b; }
  .sect a { flex:1; text-align:center; padding:11px 4px; color:#fecaca; text-decoration:none; font-weight:600; font-size:15px; border-bottom:3px solid transparent; }
  .sect a.on { color:#fff; border-bottom-color:#fff; }
  .wrap { max-width:560px; margin:0 auto; padding:14px 14px 100px; }

  .sub { color:var(--mut); font-size:14px; margin-bottom:12px; }

  button.sec { background:var(--sec); color:var(--txt); }
  button:disabled { opacity:.5; }
  .row { display:flex; gap:8px; } .row > * { flex:1; min-width:0; } input[type=date] { min-width:0; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:var(--bg); border-top:1px solid var(--line); }
  .bar .in { max-width:560px; margin:0 auto; display:flex; gap:8px; } .bar button { flex:1; }
  .card { border:1px solid var(--line); border-radius:12px; padding:12px; margin:8px 0; }
  .big { font-size:26px; font-weight:600; letter-spacing:.5px; }
  .err { background:#fef2f2; color:var(--bad); border-radius:10px; padding:10px 12px; margin:10px 0; white-space:pre-line; }
  .okb { background:#f0fdf4; color:var(--ok); border-radius:10px; padding:10px 12px; margin:10px 0; }
  .wait { background:#fffbeb; color:var(--warn); border-radius:10px; padding:10px 12px; margin:10px 0; }
  .note { background:var(--sec); border-radius:10px; padding:10px 12px; margin:10px 0; font-size:14px; }
  table { width:100%; border-collapse:collapse; font-size:14px; } td { padding:7px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.n { text-align:right; white-space:nowrap; }
  html.scan, body.scan { background:transparent !important; } body.scan { visibility:hidden; }   /* lecture d'un code : la caméra se voit derrière la page */
  #scanBar { visibility:visible; position:fixed; left:0; right:0; bottom:0; padding:14px; background:rgba(0,0,0,.72); color:#fff; text-align:center; z-index:50; }
  button:active { opacity:.55; }   /* le bouton réagit sous le doigt */
  .hidden { display:none; } .mut { color:var(--mut); font-size:13px; } .center { text-align:center; }
  .bigbtn { width:100%; padding:18px; font-size:18px; margin:8px 0; }
  img.prev, img.photo { max-width:100%; border-radius:10px; margin-top:8px; }
  th { padding:7px 4px; border-bottom:1px solid var(--line); text-align:left; } th.n { text-align:right; }
  button.danger { background:#7f1d1d; color:#fff; }
  .tabs { display:flex; gap:6px; overflow-x:auto; margin:8px 0 4px; } .tabs button { flex:none; padding:8px 12px; font-size:14px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:12px; background:var(--sec); }
  .ph3 { display:flex; gap:8px; margin:12px 0; } .ph3 button { flex:1; padding:14px 4px; font-size:15px; line-height:1.35; }
  .ph3 button.fait { background:#dcfce7; color:var(--ok); } .ph3 button.att { background:#fef3c7; color:var(--warn); }
  .phg { display:grid; grid-template-columns:repeat(10,1fr); gap:3px; margin:8px 0; } .phg div { text-align:center; font-size:11px; padding:5px 0; border-radius:6px; background:var(--sec); color:var(--mut); }
  .phg .g3 { background:#dcfce7; color:var(--ok); } .phg .g1 { background:#fef3c7; color:var(--warn); } .phg .g0 { background:#fee2e2; color:var(--bad); }
  .b-ok { background:#dcfce7; color:var(--ok); } .b-bad { background:#fee2e2; color:var(--bad); } .b-warn { background:#fef3c7; color:var(--warn); }

<script>

<script>
/* ======================= Outils ======================= */
var VERSION_APP = '1.29.0';
var TZ = 'America/Port-au-Prince', CUTOFF_HOUR = 4;
var DEV = 'dollars haïtiens';
var CHAMPS_DEFAUT = [
  { k: 'opening_meter', label: 'Compteur ouverture', req: true },
  { k: 'closing_meter', label: 'Compteur fermeture', req: true },
  { k: 'starting_cash', label: 'Solde initial', req: true, money: true },
  { k: 'counted_cash', label: 'Caisse comptée à la fermeture', req: true, money: true },
  { k: 'bank_deposit', label: 'Dépôt en banque', money: true },
  { k: 'other_cash_in', label: 'Autres entrées d\'argent', money: true },
  { k: 'generator_fuel', label: 'Carburant génératrice', money: true },
  { k: 'withdrawals', label: 'Prélèvements', money: true },
  { k: 'other_expenses', label: 'Autres dépenses', money: true },
  { k: 'gas_received', label: 'Gaz reçu aujourd\'hui (gal)' }
];
var fmt = function (n) { if (n === null || n === undefined || n === '' || isNaN(n)) return '—'; return Number(n).toLocaleString('fr-FR', { maximumFractionDigits: 2 }); };
var esc = function (s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var $ = function (id) { return document.getElementById(id); };
var dfr = function (d) { return d ? String(d).split('-').reverse().join('/') : ''; };
function libPer(p) { return { '': 'Toute la journée', AM: 'Équipe du matin', PM: 'Équipe du soir' }[p || ''] || p; }
/* Nombre strict : « 1 788 » ou « 1,788 » = mille sept cent quatre-vingt-huit ; « 1788 2862 » est refusé (deux montants collés) ;
   plusieurs montants s'additionnent avec + (ex. 1788+2862). */
function nb(s) {
  s = String(s === undefined || s === null ? '' : s).replace(/[$]|HTG|gdes?/gi, '').trim(); if (!s) return null;
  var tot = 0, parts = s.split('+');
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i].trim();
    if (!/^(\d{1,3}([ \u00a0\u202f,]\d{3})+|\d+)(\.\d+)?$/.test(p)) return null;
    tot += Number(p.replace(/[ \u00a0\u202f,]/g, ''));
  }
  return Math.round(tot * 100) / 100;
}

/* Heure d'Haïti, même règle que le serveur : avant 4 h, c'est encore la veille. */
function partiesHaiti(t) {
  var f = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  var o = {}; f.formatToParts(t).forEach(function (p) { o[p.type] = p.value; });
  if (o.hour === '24') o.hour = '00';
  return o;
}
function dateRapport() {
  var now = new Date(), p = partiesHaiti(now);
  var d = Number(p.hour) < CUTOFF_HOUR ? new Date(now.getTime() - 24 * 3600 * 1000) : now;
  var q = partiesHaiti(d);
  return q.year + '-' + q.month + '-' + q.day;
}
function maintenant() { var p = partiesHaiti(new Date()); return p.year + '-' + p.month + '-' + p.day + ' ' + p.hour + ':' + p.minute + ':' + p.second; }
function refAleatoire(code, date) {
  var L = 'ABCDEFGHJKLMNPQRSTUVWXYZ', s = '', a = new Uint32Array(4);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach(function (_, i) { a[i] = Math.floor(Math.random() * 1e9); });
  for (var i = 0; i < 4; i++) s += L.charAt(a[i] % L.length);
  return code + '-' + date.replace(/-/g, '') + '-' + s;
}

/* ======================= Stockage ======================= */
var CFG = {
  get: function (k, d) { try { var v = localStorage.getItem('rrd.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem('rrd.' + k, JSON.stringify(v)); } catch (e) { } if (CLES_SURES.indexOf(k) >= 0) copieNative(); },
  del: function (k) { try { localStorage.removeItem('rrd.' + k); } catch (e) { } if (CLES_SURES.indexOf(k) >= 0) copieNative(); }
};
/* Copie de sécurité dans le stockage natif du téléphone : la mise à jour de l'APK peut vider le stockage web. */
var NAT = (window.Capacitor && Capacitor.Plugins) || {};
/* Version web (iPhone, ordinateur) : seulement pour la direction et la comptabilité, qui sont toujours en ligne. */
var WEB = !(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
var CLES_SURES = ['jeton', 'role', 'nom', 'station', 'api', 'appareil', 'init', 'init_le', 'champs', 'noms'];
function copieNative() {
  if (!NAT.Preferences) return;
  var o = {}; CLES_SURES.forEach(function (k) { var v = localStorage.getItem('rrd.' + k); if (v !== null) o[k] = v; });
  NAT.Preferences.set({ key: 'rrd.sauvegarde', value: JSON.stringify(o) }).catch(function () { });
}
var FS_DOSSIER = 'rapports';
function copieRapport(r) {
  if (!NAT.Filesystem) return Promise.resolve();
  return NAT.Filesystem.writeFile({ path: FS_DOSSIER + '/' + r.ref + '.json', directory: 'DATA', data: JSON.stringify(r), encoding: 'utf8', recursive: true }).catch(function () { });
}
/* Au démarrage : identité fixe du téléphone + restauration de ce que le stockage web aurait perdu. */
function restaurer() {
  var etapes = [];
  if (NAT.Preferences) etapes.push(NAT.Preferences.get({ key: 'rrd.sauvegarde' }).then(function (x) {
    if (!x || !x.value) return copieNative();
    var o = JSON.parse(x.value);
    Object.keys(o).forEach(function (k) { if (localStorage.getItem('rrd.' + k) === null) localStorage.setItem('rrd.' + k, o[k]); });
  }).catch(function () { }));
  if (NAT.Device) etapes.push(NAT.Device.getId().then(function (x) { if (x && x.identifier) S.idFixe = 'D' + x.identifier; }).catch(function () { }));
  if (NAT.Filesystem) etapes.push(NAT.Filesystem.readdir({ path: FS_DOSSIER, directory: 'DATA' }).then(function (d) {
    return tous().then(function (liste) {
      var connus = {}; liste.forEach(function (r) { connus[r.ref] = r; });
      return Promise.all((d.files || []).map(function (f) {
        var nom = typeof f === 'string' ? f : f.name; if (!/\.json$/.test(nom)) return;
        var ref = nom.replace(/\.json$/, ''); if (connus[ref]) return;
        return NAT.Filesystem.readFile({ path: FS_DOSSIER + '/' + nom, directory: 'DATA', encoding: 'utf8' })
          .then(function (c) { return tx('readwrite', function (s) { s.put(JSON.parse(c.data)); }); }).catch(function () { });
      }));
    });
  }).catch(function () { }));
  return Promise.all(etapes);
}
/* File d'attente dans IndexedDB (les photos sont trop lourdes pour localStorage). */
var DB = null;
function db() {
  if (DB) return Promise.resolve(DB);
  return new Promise(function (res, rej) {
    var r = indexedDB.open('rrd-rapports', 1);
    r.onupgradeneeded = function () { r.result.createObjectStore('rapports', { keyPath: 'ref' }); };
    r.onsuccess = function () { DB = r.result; res(DB); };
    r.onerror = function () { rej(r.error); };
  });
}
function tx(mode, fn) {
  return db().then(function (d) {
    return new Promise(function (res, rej) {
      var t = d.transaction('rapports', mode), s = t.objectStore('rapports'), out;
      out = fn(s); t.oncomplete = function () { res(out && out.result !== undefined ? out.result : out); }; t.onerror = function () { rej(t.error); };
    });
  });
}
function tous() { return tx('readonly', function (s) { return s.getAll(); }); }
function sauver(r) { return tx('readwrite', function (s) { s.put(r); }).then(function () { return copieRapport(r); }); }

/* ======================= Serveur ======================= */
function api(action, extra) {
  var url = (window.RRD_CONFIG && RRD_CONFIG.API_URL) || CFG.get('api', '');   // l'adresse du bureau vient de l'application, elle n'est plus saisie
  if (!url) return Promise.reject({ erreur: 'Adresse du serveur manquante.', code: 'CONFIG', reseau: false });
  var body = Object.assign({ action: action, jeton: CFG.get('jeton', '') }, extra || {});
  var ctl = new AbortController(), t = setTimeout(function () { ctl.abort(); }, 60000);
  return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow', signal: ctl.signal })
    .then(function (r) { clearTimeout(t); return r.text(); })
    .then(function (txt) {
      var j; try { j = JSON.parse(txt); } catch (e) { throw { erreur: 'Réponse illisible du serveur.', reseau: true }; }
      if (!j.ok) throw { erreur: j.erreur, code: j.code || '', reseau: j.code === 'SERVEUR', controles: j.controles || null };
      return j.data;
    }, function () { clearTimeout(t); throw { erreur: 'Pas de connexion.', reseau: true }; });
}

/* ======================= Envoi quand l'application est fermée =======================
 * Application installée build 60 et plus. Chaque élément en attente (rapport, photo, bordereau, opération de camion) est aussi copié
 * dans la mémoire privée du téléphone, sous la forme exacte que le bureau reçoit. Quand l'application n'est plus à l'écran,
 * une tâche d'Android envoie ces copies dès qu'il y a du réseau et garde la réponse du bureau. À la prochaine ouverture,
 * l'application lit ces réponses (apiFile) au lieu d'envoyer une deuxième fois. Le bureau ne garde jamais deux fois le même élément. */
var FOND = { cours: null, encore: false }, FOND_NATIF = 60;
function fondOk() { return !WEB && !!NAT.RrdFond; }
function fondId(cid) { return String(cid).replace(/[^A-Za-z0-9-]/g, '-').slice(0, 80) || '-'; }
function rapCorps(r) { var payload = {}; Object.keys(r).forEach(function (k) { if (['statut', 'cree_le', 'erreur', 'vu', 'recu_le', 'station', 'controles'].indexOf(k) < 0) payload[k] = r[k]; }); return ['envoyer', { payload: payload }]; }
function phCorps(r) {
  return r.genre === 'bordereau'
    ? ['bordereau', { payload: { cid: r.cid, pris_ms: r.pris_ms, photo: r.photo, montant: r.montant, devise: r.devise, beneficiaire: r.beneficiaire, numero: r.numero, note: r.note, date_depot: r.date_depot } }]
    : ['photo', { payload: { cid: r.cid, type: r.type, pris_ms: r.pris_ms, compteur: r.compteur, photo: r.photo } }];
}
function cmCorps(r) {
  return ['camion', { payload: { genre: r.op, cid: r.cid, pris_ms: r.pris_ms, photo: r.photo, client_id: r.client_id, client: r.client, gallons: r.gallons, mode: r.mode, paye: r.paye, montant: r.montant, devise: r.devise,
    bon_no: r.bon_no, fournisseur: r.fournisseur, detail: r.detail, note: r.note, lat: r.lat, lon: r.lon, precision: r.precision, date: r.date_rapport, employes: r.employes, remis: r.remis,
    depose: r.depose, depose_pour: r.depose_pour, depose_par: r.depose_par, bureau: r.bureau, bureau_qui: r.bureau_qui, main: r.main, main_qui: r.main_qui } }];
}
/* Envoi d'un élément de la file : si le bureau a déjà répondu pendant que l'application était fermée, on reprend cette réponse. */
function apiFile(corps, cid) {
  if (!fondOk()) return api(corps[0], corps[1]);
  return NAT.RrdFond.resultat({ id: fondId(cid) }).then(function (x) { return (x && x.rep) || ''; }, function () { return ''; }).then(function (rep) {
    var j = null; if (rep) try { j = JSON.parse(rep); } catch (e) { }
    if (!j || typeof j.ok !== 'boolean') return api(corps[0], corps[1]);
    if (!j.ok) throw { erreur: j.erreur, code: j.code || '', reseau: false, controles: j.controles || null };
    return j.data;
  });
}
/* Tout ce que ce téléphone doit encore envoyer, dans l'ordre : les rapports d'abord, puis photos, bordereaux et opérations par heure de prise. */
function fondElements() {
  var role = CFG.get('role', ''), att = function (r) { return r.statut === 'attente'; };
  if (!CFG.get('jeton', '')) return Promise.resolve([]);
  if (role === 'camion') return cmMiens().then(function (l) { return l.filter(att).map(function (r) { return { cid: r.cid, ordre: r.pris_ms, corps: cmCorps(r) }; }); });
  if (role) return Promise.resolve([]);
  return Promise.all([tous(), phMiens()]).then(function (x) {
    return x[0].filter(att).sort(function (a, b) { return a.cree_le < b.cree_le ? -1 : 1; }).map(function (r, i) { return { cid: r.ref, ordre: i + 1, corps: rapCorps(r) }; })
      .concat(x[1].filter(att).map(function (r) { return { cid: r.cid, ordre: r.pris_ms, corps: phCorps(r) }; }));
  });
}
/* Met les copies du téléphone d'accord avec la file : ajoute ce qui manque, retire ce qui est réglé. Sans effet sur une ancienne application. */
function fondAligner() {
  if (!fondOk()) return Promise.resolve();
  if (FOND.cours) { FOND.encore = true; return FOND.cours; }
  var F = NAT.RrdFond, url = (window.RRD_CONFIG && RRD_CONFIG.API_URL) || CFG.get('api', '');
  var travail = F.regler({ url: url, jeton: CFG.get('jeton', '') }).then(function () { return Promise.all([F.etat(), fondElements()]); }).then(function (x) {
    var la = {}, faits = {}, veut = {}, ops = [];
    (x[0].attente || []).forEach(function (id) { la[id] = 1; }); (x[0].faits || []).forEach(function (id) { faits[id] = 1; });
    x[1].forEach(function (e) { veut[fondId(e.cid)] = 1; });
    Object.keys(Object.assign({}, la, faits)).forEach(function (id) { if (!veut[id]) ops.push(function () { return F.retirer({ id: id }); }); });
    x[1].forEach(function (e) {
      var id = fondId(e.cid);
      if (!la[id] && !faits[id]) ops.push(function () { return F.ajouter({ id: id, ordre: e.ordre, corps: JSON.stringify(Object.assign({ action: e.corps[0], jeton: '@@JETON@@' }, e.corps[1])) }); });
    });
    return ops.reduce(function (p, f) { return p.then(f).catch(function () { }); }, Promise.resolve());
  });
  FOND.cours = Promise.race([travail, new Promise(function (res) { setTimeout(res, 8000); })]).catch(function () { }).then(function () {
    FOND.cours = null; if (FOND.encore) { FOND.encore = false; return fondAligner(); }
  });
  return FOND.cours;
}

/* ======================= État ======================= */
var S = { init: null, en_ligne: false, sync: false };
/* Un écran rafraîchi tout seul (photo partie, réponse du bureau, minuterie) ne doit jamais remplacer un bouton pendant qu'on le touche :
 * le toucher serait perdu. On attend que le doigt soit levé. */
var TOUCHE = { on: false, fin: 0 };
document.addEventListener('touchstart', function () { TOUCHE.on = true; }, { passive: true, capture: true });
['touchend', 'touchcancel'].forEach(function (ev) { document.addEventListener(ev, function () { TOUCHE.on = false; TOUCHE.fin = Date.now(); }, { passive: true, capture: true }); });
function fond(ecran, fn) {
  if (TOUCHE.on || Date.now() - TOUCHE.fin < 400) return setTimeout(function () { fond(ecran, fn); }, 300);
  if (S.ecran === ecran) fn();
}
/* Appareil photo. Avec l'application installée récente (build 43 et plus), la photo passe par l'appareil photo du téléphone lui-même :
 * l'image arrive déjà réduite (plus de panne avec les très grandes photos) et on sait pourquoi quand il ne s'ouvre pas.
 * Sinon, ou en cas de panne, on revient au bouton de fichier du navigateur. */
function toast(t) {   // petit mot en bas de l'écran : montre que le bouton a bien été touché
  var d = $('toast');
  if (!d) { d = document.createElement('div'); d.id = 'toast'; d.style.cssText = 'position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:60;white-space:nowrap'; document.body.appendChild(d); }
  d.textContent = t; d.style.display = 'block'; clearTimeout(S.toastT); S.toastT = setTimeout(function () { d.style.display = 'none'; }, 2500);
}
function prendrePhoto(inputId, suite, source) {   // source 'PHOTOS' = galerie du téléphone (bordereaux seulement) ; sinon l'appareil photo
  var gal = source === 'PHOTOS', C = NAT.Camera, repli = function () { var i = $(inputId); i.value = ''; i.click(); };
  toast(gal ? 'Ouverture de la galerie…' : 'Ouverture de l\'appareil photo…');
  if (!C || S.photoRepli) return repli();
  if (S.photoEnCours && Date.now() - S.photoEnCours < 2500) return;   // deux touchers de suite : un seul appareil photo
  S.photoEnCours = Date.now();
  /* Garde-fou : si, 4 secondes après le toucher, l'appareil photo ne s'est pas ouvert (l'application n'a été ni cachée ni mise en pause)
   * et que le téléphone n'a rien répondu, on passe par l'ancien chemin au lieu de laisser un bouton sans effet. */
  var regle = false, parti = false, vu = function () { parti = true; };
  document.addEventListener('pause', vu); window.addEventListener('blur', vu); document.addEventListener('visibilitychange', vu);
  var fin = function () { regle = true; S.photoEnCours = 0; document.removeEventListener('pause', vu); window.removeEventListener('blur', vu); document.removeEventListener('visibilitychange', vu); };
  setTimeout(function () { if (regle || parti || document.hidden) return; fin(); if (!gal) S.photoRepli = true; toast('Nouvel essai…'); repli(); }, 4000);
  var appel;
  try { appel = C.getPhoto({ source: gal ? 'PHOTOS' : 'CAMERA', resultType: 'dataUrl', quality: 80, width: 1600, correctOrientation: true, saveToGallery: false }); }
  catch (e) { fin(); if (!gal) S.photoRepli = true; return repli(); }
  appel.then(function (ph) {
    if (regle) return; fin(); if (ph && ph.dataUrl) suite(ph.dataUrl);
  }, function (e) {
    if (regle) return; fin();
    var m = String((e && (e.message || e.errorMessage)) || e || '');
    if (/cancel/i.test(m)) return;
    if (gal) return repli();   // galerie refusée ou en panne : le sélecteur de fichiers du téléphone fait le même travail, sans autorisation
    if (/denied|permission/i.test(m)) return alerte('L\'appareil photo est bloqué pour RRD. Ouvrez Paramètres du téléphone > Applications > RRD > Autorisations > Appareil photo, puis choisissez « Autoriser ».');
    S.photoRepli = true; repli();   // autre panne : l'ancien chemin sert pour le reste de la session
  });
}

function infoServeur(date) {
  /* Ce que le serveur a dit (dernière connexion) pour ce jour-là, ou null si on ne sait pas. */
  var c = S.init || CFG.get('init', null); if (!c) return null;
  if (c.date === date) return { envoyes: c.envoyes || [], prerempli: c.prerempli || null };
  var j = (c.jours || []).filter(function (x) { return x.date === date; })[0];
  return j ? { envoyes: j.envoyes || [], prerempli: j.prerempli || null } : null;
}
function infosDuJour(liste, date) {
  /* Ce qu'on sait pour un jour : rapports confirmés par le serveur + ceux en attente sur le téléphone. */
  date = date || dateRapport(); var st = stationCode();
  var cache = infoServeur(date);
  var envoyes = cache ? cache.envoyes.slice() : [];
  var locaux = liste.filter(function (r) { return r.date === date && r.station === st && r.statut !== 'rejete' && r.statut !== 'annule'; });
  locaux.forEach(function (r) { if (!envoyes.some(function (x) { return x.ref === r.ref; })) envoyes.push({ ref: r.ref, periode: r.periode, local: r }); });
  var pers = envoyes.map(function (r) { return String(r.periode || ''); });
  var periodes;
  if (pers.indexOf('') >= 0) periodes = [];
  else if (pers.indexOf('AM') >= 0 && pers.indexOf('PM') >= 0) periodes = [];
  else if (pers.indexOf('AM') >= 0) periodes = ['PM'];
  else if (pers.indexOf('PM') >= 0) periodes = ['AM'];
  else periodes = ['', 'AM'];
  return { date: date, envoyes: envoyes, periodes: periodes, connu: !!cache, prerempli: cache ? cache.prerempli : null };
}

function nouveau(date) {

    J = infosDuJour(liste, date || auj); J.retard = J.date !== auj; V = {}; PHOTO = '';

    // Dernier rapport du téléphone AVANT ce jour/cette équipe (pour un jour passé, on ne prend pas un rapport plus récent).

          '<div class="mut">' + (x.methode === 'vide' ? 'Depuis le ' + dfr(x.depuis) + ' (à sec)' : 'Pas de date « à sec » connue : calcul depuis le point le plus bas des rapports (' + dfr(x.depuis) + ')') +

}

      '<label>Genre</label><select id="mType"><option value="conseil">💡 Conseil du jour</option><option value="message">✉️ Message</option></select>' +
      '<label>Quand</label><select id="mQuand" onchange="msgQuand()"><option value="maintenant">Envoyer maintenant</option><option value="plus_tard">Programmer pour plus tard</option></select>' +

    h += '<h2>Messages programmés et récents</h2>';
    if (!d.messages.length) h += '<div class="note">Aucun message.</div>';
    d.messages.forEach(function (m) {
      h += '<div class="card"><div class="row"><div><b>' + (m.type === 'conseil' ? '💡 Conseil' : '✉️ Message') + '</b> · ' + dfr(m.date) + ' à ' + esc(m.heure) + '<div class="mut">' + esc(m.cible_nom) + ' · par ' + esc(m.par) + '</div><div style="margin-top:6px;white-space:pre-line">' + esc(m.texte) + '</div></div>' +
        (gestion ? '<div style="flex:none"><button class="sec" onclick="msgSupprimer(' + Number(m.id) + ')">Supprimer</button></div>' : '') + '</div>' +
        ((m.reponses || []).length ? '<div class="note" style="margin-bottom:0"><b>Réponses (' + m.reponses.length + ')</b>' + m.reponses.map(function (r) {
          return '<div style="margin-top:6px;white-space:pre-line">↩︎ <b>' + esc(r.nom) + '</b> · ' + esc(String(r.ecrit_le).slice(8, 10) + '/' + String(r.ecrit_le).slice(5, 7) + ' à ' + String(r.ecrit_le).slice(11, 16)) + '<br>' + esc(r.texte) + '</div>';
        }).join('') + '</div>' : '<div class="mut" style="margin-top:6px">Pas encore de réponse.</div>') + '</div>';
    });

function msgQuand() {
  var m = $('mQuand').value === 'maintenant';

}
function msgAjouter() {
  var m = $('mQuand').value === 'maintenant', q = partiesHaiti(new Date());
  var p = { cible: $('mCible').value, type: $('mType').value, texte: String($('mTexte').value || '').trim(),

  $('bMsg').disabled = true;
  call('messageAjouter', p).then(function (d) { ongletMessages(d, m ? 'Message envoyé.' : 'Message programmé.'); }).catch(function (e) { $('bMsg').disabled = false; alerte(e.erreur || 'Pas de connexion.'); });

function msgSupprimer(id) {

  call('messageSupprimer', { id: id }).then(function (d) { ongletMessages(d, 'Message supprimé.'); }).catch(function (e) { alerte(e.erreur || 'Pas de connexion.'); });

function ajouterPrix() {

function ongletAppareils(data) {
  var rendre = function (a) {
    var h = entete();
    if (a.nouveau) h += '<div class="okb">Nouveau code : <b style="font-size:20px">' + esc(a.nouveau) + '</b><br>Donnez-le à la personne qui enregistre le téléphone. Un code de station ne marche que sur un seul téléphone ; un code Direction ou Comptabilité peut servir sur 5 appareils.</div>';
    h += '<h2>Nouveau code de téléphone</h2><label>Pour</label><select id="apSt">' + optStations('', false, '<option value="DIRECTION">Direction (tableau de bord)</option><option value="COMPTA">Comptabilité (tableau de bord)</option>' + (a.transferts || []).map(function (t) { return '<option value="' + esc(t.code) + '">' + esc(t.nom) + '</option>'; }).join('') + (a.camions || []).map(function (c) { return '<option value="' + esc(c.code) + '">🚚 ' + esc(c.nom) + '</option>'; }).join('')) + '</select>' +

    if (!a.appareils.length) h += '<div class="note">Aucun téléphone.</div>';
    a.appareils.slice().reverse().forEach(function (x) {
      h += '<div class="card" style="' + (x.actif ? '' : 'opacity:.55') + '"><div class="row"><div><b>' + esc(x.station_nom) + '</b>' + (x.nom ? ' · ' + esc(x.nom) : '') +
        '<div class="mut">Code ' + esc(x.code) + ' · ' + (x.utilise ? 'enregistré le ' + esc(x.enregistre_le) : 'pas encore utilisé') + (x.partage && x.utilise ? ' · ' + x.nb + ' appareil(s) sur ' + x.max : '') + (x.dernier_contact ? ' · vu le ' + esc(x.dernier_contact) : '') + (x.push ? ' · 🔔 notifications actives' : '') + '</div>' +

function nouveauCode() {

function liberer(code) {
  if (!confirm('Libérer le code ' + code + ' ?\n\nLe téléphone qui l\'utilise sera déconnecté (ses rapports pas encore envoyés resteront bloqués dessus). Le code pourra ensuite être entré une fois sur n\'importe quel téléphone.')) return;
  call('libererAppareil', { code: code }).then(function (d) { ongletAppareils(d); alerte('Code ' + code + ' libéré : il peut être entré sur un téléphone.'); }).catch(function (e) { alerte(e.erreur || 'Pas de connexion.'); });
}
function basculer(code, actif) {
  if (!actif && !confirm('Désactiver le téléphone ' + code + ' ? Il ne pourra plus envoyer de rapports.')) return;
  call('activerAppareil', { code: code, actif: actif }).then(ongletAppareils).catch(function (e) { alerte(e.erreur || 'Pas de connexion.'); });
}

/* ======================= Mises à jour automatiques ======================= */
var MAJ_URL = 'https://github.com/redrebeldistribution/RRD-APP/releases/latest/download/web.json';
function bandeauMaj() {
  if (!S.majApk || !$('app') || $('majApk')) return;
  var d = document.createElement('div'); d.id = 'majApk'; d.className = 'wait';
  d.innerHTML = '⬆️ Nouvelle version de l\'application disponible.<br><button style="margin-top:8px" onclick="installerApk()">Installer</button>';
  $('app').insertBefore(d, $('app').firstChild);
}
function installerApk() { if (confirm('Le téléchargement va s\'ouvrir. Ensuite, touchez le fichier puis « Installer ». Vos rapports restent sur le téléphone.')) location.href = S.majApk; }
function verifierMaj() {
  var P = window.Capacitor && Capacitor.Plugins, CU = P && P.CapacitorUpdater, AP = P && P.App;
  if (!CU || !AP || S.majEnCours || navigator.onLine === false) return;
  S.majEnCours = true;
  var m;
  fetch(MAJ_URL + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (x) {
    m = x; return AP.getInfo();
  }).then(function (info) {
    var natif = Number(info.build) || 0; S.natif = natif; S.apk = m.apk_url;
    if (Number(m.native_min) > natif) { S.majApk = m.apk_url; bandeauMaj(); return; }      // il faut une nouvelle APK
    if (!(Number(m.web) > Number(window.RRD_BUILD || 0))) return;                          // déjà à jour
    var ver = String(m.web);
    return CU.list().then(function (l) {
      var deja = ((l && l.bundles) || []).filter(function (b) { return b.version === ver && (b.status === 'success' || b.status === 'pending'); })[0];
      return deja || CU.download({ url: m.url, version: ver, checksum: String(m.checksum || '') });   // sans empreinte (checksum), le téléchargement est refusé
    }).then(function (b) { return CU.next({ id: b.id }); }).then(function () { S.majPrete = ver; S.majErreur = ''; fond('accueil', accueil); });
  }).catch(function (e) { S.majErreur = String((e && (e.message || e.errorMessage)) || e || '').slice(0, 90); }).then(function () { S.majEnCours = false; });
}
document.addEventListener('resume', function () { verifierMaj(); bandeauMaj(); phEnvoyer(); msgCharger(); ntBientot(); repEnvoyer(); pushRepli(); cmReprise(); });
setInterval(function () { phEnvoyer(); fond('photos', ecranPhotos); msgCharger(); repEnvoyer(); cmEnvoyer(); }, 60000);   // file des photos + heure en cours à jour
setTimeout(verifierMaj, 4000); setInterval(verifierMaj, 3 * 3600 * 1000);

/* Téléphone à petite mémoire : Android peut fermer l'application pendant que l'appareil photo est ouvert. Au retour, la photo est rendue ici. */
try { NAT.App && NAT.App.addListener && NAT.App.addListener('appRestoredResult', function (r) {
  var d = r && r.pluginId === 'Camera' && r.methodName === 'getPhoto' && r.success && r.data && r.data.dataUrl, enc = CFG.get('phEnCours', null);
  if (!d || !enc || Date.now() - enc.ms > 10 * 60000) return;
  setTimeout(function () { if (CFG.get('jeton', '') && !CFG.get('role', '')) { PH.type = enc.type; PH.source = enc.source || ''; phImage(d); } }, 1500);
}); } catch (e) { }
restaurer().then(function () {
  if (!CFG.get('jeton', '')) ecranEnregistrer();
  else if (CFG.get('role', '') === 'transferts') {   // agent de transfert sans station : pas de rapports, seulement les transferts
    if (/[?&]code=1/.test(location.search)) { view('<p class="center mut" style="margin-top:40px">…</p>'); changerCode(function () { location.replace('transfert.html'); }); }
    else location.replace('transfert.html');
  }
  else if (CFG.get('role', '') === 'camion') demarrerCamion();
  else if (CFG.get('role', '')) demarrerDirection();
  else phMigrer().then(function () { if (/[?&]photos=1/.test(location.search)) { ecranPhotos(); phActualiser(); } else { accueil(); phEnvoyer(); } synchroniser(); ntDemarrer(); });
});
